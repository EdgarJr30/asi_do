project_id = "asi_do"

[storage]
enabled = true
# Tope global, no por bucket: cada bucket lo ajusta hacia abajo en su migración.
# Tiene que cubrir al mayor, que es `public-media` con 50 MB (20260626120000);
# con los 5MiB que decía antes, un push de storage habría dejado el bucket de
# video sin poder recibir un solo archivo.
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

# Vector Buckets es de plan Pro. El CLI trae `enabled = true` por defecto en su
# plantilla, asi que omitir este bloque no significa "no lo uses": significa que
# el push manda `true` y el plan gratuito responde
# `402: Please upgrade the project to a paid tier to enable vector buckets`.
# Ese 402 abortaba el paso de Storage entero, y por eso la configuracion de
# Storage de este repo nunca llego al remoto pese a que `supabase/README.md` la
# declara fuente de verdad. Declararlo en falso es lo que desatasca el push.
# (`[storage.analytics]` no hace falta: su default ya es `false`.)
[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "https://dev.asidominicana.do"
# `redirectTo` solo se respeta si coincide con esta lista. Los callbacks locales
# son exactos (sin wildcard) para que registro y recuperacion funcionen desde la
# computadora del desarrollador. Este config pertenece al proyecto Supabase de
# desarrollo y no admite ningun origen de produccion.
additional_redirect_urls = [
  "http://localhost:5173/auth/confirm",
  "http://localhost:5173/auth/reset-password",
  "http://127.0.0.1:5173/auth/confirm",
  "http://127.0.0.1:5173/auth/reset-password",
  "https://dev.asidominicana.do/auth/confirm",
  "https://dev.asidominicana.do/auth/sign-in",
  "https://dev.asidominicana.do/auth/reset-password",
  "https://dev.asidominicana.do/candidate/profile"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# La politica vive aqui y se replica en `signUpFormSchema` (auth-schemas.ts). Si
# cambia una, cambia la otra: el cliente solo puede ser igual de estricto, nunca
# menos, o la UI aceptaria contrasenas que el servidor rechaza.
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Exige sesion reciente para cambiar la contrasena: una sesion robada y olvidada
# en un dispositivo ajeno no basta para quedarse con la cuenta.
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirma tu cuenta en ASI"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Tu acceso a ASI ya esta listo"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Accede a ASI con tu enlace seguro"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Restablece tu acceso a ASI"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirma el cambio de tu correo"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Codigo de verificacion de seguridad"
content_path = "./supabase/templates/reauthentication.html"

[functions.resend-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/resend-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/resend-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/resend-webhook/*.html" ]
