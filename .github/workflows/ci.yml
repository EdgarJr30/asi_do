name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El `build` que cierra `verify` corre en modo produccion, asi que pasa por
      # `validateProductionEnv` y aborta si falta una variable critica. En CI no
      # hay `.env.local` —esta en `.gitignore`— y solo llegan las URLs de
      # `.env.production`, asi que sin esto el build nunca podia terminar aqui.
      #
      # Los valores son ficticios a proposito: lo que CI comprueba es que el
      # proyecto compila y empaqueta, no la configuracion del despliegue. Esa la
      # sigue guardando el mismo `validateProductionEnv` en el build real de
      # Netlify, que es el unico que se publica y el unico que ve los valores
      # verdaderos.
      - name: Run repository verification
        run: npm run verify
        env:
          VITE_SUPABASE_URL: https://proyecto-de-ci.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_de_ci
          VITE_AZUL_PAYMENTS_URL: https://pagos-de-ci.invalid

      # El fallo intermitente de la suite aparecio dos veces dentro de `verify` y
      # las dos veces se perdio el nombre del test, porque el stdout se lo llevo
      # el comando siguiente de la cadena. El JUnit queda en disco pase lo que
      # pase; se sube solo cuando el job falla, que es cuando hace falta.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-${{ github.run_id }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

      # Umbrales fijados al nivel real de hoy, no a una aspiracion: funcionan
      # como trinquete —impiden que la cobertura baje— y se suben a mano cuando
      # el numero se despega. Un umbral inalcanzable se termina bajando o
      # ignorando, que es como estos controles dejan de servir.
      - name: Enforce coverage thresholds
        run: npm run test:coverage

      # Los sourcemaps se generan como `hidden` y `netlify.toml` bloquea su
      # descarga publica, asi que la unica copia utilizable para mapear un stack
      # de `app_error_logs` es esta.
      - name: Upload sourcemaps
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ github.sha }}
          path: dist/assets/*.map
          if-no-files-found: warn
          retention-days: 30

  azul-service:
    name: Verify AZUL payments service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job aislado: el servicio tiene su propio package-lock y su propio verify, y
    # hasta ahora CI solo validaba la raiz. Un fallo suyo no debe confundirse con
    # uno del frontend.
    defaults:
      run:
        working-directory: services/azul-payments
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/azul-payments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run service verification
        run: npm run verify

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cobertura solo prueba que una linea se ejecuto. Stryker altera las
      # decisiones RBAC criticas y exige que los asserts detecten el defecto.
      - name: Enforce mutation score
        run: npm run test:mutation

      - name: Upload mutation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14

  edge-functions:
    name: Lint and test Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `eslint` excluye `supabase/functions` porque ese codigo corre en Deno, no en
    # Node: importa con extension `.ts` explicita y usa `npm:`/`jsr:` specifiers,
    # que la config de Node no entiende. Sin este job, las Edge Functions no las
    # revisa nadie.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Edge Functions
        run: deno lint supabase/functions

      # Cubren la guarda fail-closed del arnes —lo unico que impide sembrar
      # decenas de miles de filas sinteticas contra produccion— y las metricas
      # que sustentan las mediciones de rendimiento, donde un percentil mal
      # calculado no falla de forma visible: da un numero creible y equivocado.
      - name: Run Edge Function tests
        run: deno test supabase/functions

      # `deno check` queda fuera a proposito, por ahora. Reporta 15 errores, y se
      # comprobo uno por uno que **ninguno es un defecto de runtime**: son
      # artefactos de que `createClient` se invoca sin el generic `Database`, asi
      # que supabase-js infiere `SupabaseClient<any, ...>` y deja de encajar en
      # las firmas de los helpers. El caso mas enganoso es
      # `stress-harness/index.ts:109`, donde el tipo dice que `platform_roles`
      # llega como array; se verifico contra el remoto que PostgREST devuelve un
      # objeto, asi que la guarda de super admin funciona y "corregirla" segun el
      # tipo la habria roto.
      #
      # Activar el job con `deno check` exige antes enhebrar el tipo `Database`
      # por las funciones. Anotado en TASK-255; hasta entonces un job rojo de
      # nacimiento solo ensenaria al equipo a ignorar CI.

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # El smoke autenticado se provee su propia cuenta efimera con service_role
      # y la borra al terminar, asi que no depende de que exista una cuenta de
      # prueba concreta. Sin el secreto el bloque autenticado se salta y solo
      # corre el publico; con el, cero skips.
      - name: Run smoke suite
        run: npm run test:e2e:smoke
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency audit policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install AZUL service dependencies
        run: npm ci
        working-directory: services/azul-payments

      # Politica en `scripts/audit-policy.ts`: high y critical rompen, con
      # excepciones documentadas y con fecha de vencimiento en
      # `audit-exceptions.json`.
      - name: Enforce dependency audit policy
        run: npm run audit:policy
