name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  # Relanzar a mano sin inventar un commit vacio: cuando el fallo esta en un
  # secreto (no en el codigo), la unica forma de reprobarlo era pushear algo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El `build` que cierra `verify` corre en modo produccion, asi que pasa por
      # `validateProductionEnv` y aborta si falta una variable critica. En CI no
      # hay `.env.local` —esta en `.gitignore`— y los endpoints no se versionan,
      # asi que este job inyecta un contrato de produccion ficticio y coherente.
      #
      # Los valores son ficticios a proposito: lo que CI comprueba es que el
      # proyecto compila y empaqueta, no la configuracion del despliegue. Esa la
      # sigue guardando el mismo `validateProductionEnv` en el build real de
      # despliegue, que es el unico que se publica y el unico que ve los valores
      # verdaderos.
      - name: Run repository verification
        run: npm run verify
        env:
          VITE_DEPLOY_ENV: production
          VITE_SUPABASE_URL: https://proyecto-de-ci.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_de_ci
          VITE_AZUL_PAYMENTS_URL: https://pagos-de-ci.invalid
          VITE_AUTH_SITE_URL: https://app-de-ci.invalid
          VITE_PRODUCTION_SITE_URL: https://app-de-ci.invalid

      # El fallo intermitente de la suite aparecio dos veces dentro de `verify` y
      # las dos veces se perdio el nombre del test, porque el stdout se lo llevo
      # el comando siguiente de la cadena. El JUnit queda en disco pase lo que
      # pase; se sube solo cuando el job falla, que es cuando hace falta.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-junit-${{ github.run_id }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

      # Umbrales fijados al nivel real de hoy, no a una aspiracion: funcionan
      # como trinquete —impiden que la cobertura baje— y se suben a mano cuando
      # el numero se despega. Un umbral inalcanzable se termina bajando o
      # ignorando, que es como estos controles dejan de servir.
      - name: Enforce coverage thresholds
        run: npm run test:coverage

      # Los sourcemaps se generan como `hidden` y `public/.htaccess` bloquea su
      # descarga publica, asi que la unica copia utilizable para mapear un stack
      # de `app_error_logs` es esta.
      - name: Upload sourcemaps
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: sourcemaps-${{ github.sha }}
          path: dist/assets/*.map
          if-no-files-found: warn
          retention-days: 30

  azul-service:
    name: Verify AZUL payments service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job aislado: el servicio tiene su propio package-lock y su propio verify, y
    # hasta ahora CI solo validaba la raiz. Un fallo suyo no debe confundirse con
    # uno del frontend.
    defaults:
      run:
        working-directory: services/azul-payments
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/azul-payments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run service verification
        run: npm run verify

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cobertura solo prueba que una linea se ejecuto. Stryker altera las
      # decisiones RBAC criticas y exige que los asserts detecten el defecto.
      - name: Enforce mutation score
        run: npm run test:mutation

      - name: Upload mutation report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14

  edge-functions:
    name: Lint and test Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `eslint` excluye `supabase/functions` porque ese codigo corre en Deno, no en
    # Node: importa con extension `.ts` explicita y usa `npm:`/`jsr:` specifiers,
    # que la config de Node no entiende. Sin este job, las Edge Functions no las
    # revisa nadie.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Edge Functions
        run: deno lint supabase/functions

      # Cubren la guarda fail-closed del arnes —lo unico que impide sembrar
      # decenas de miles de filas sinteticas contra produccion— y las metricas
      # que sustentan las mediciones de rendimiento, donde un percentil mal
      # calculado no falla de forma visible: da un numero creible y equivocado.
      - name: Run Edge Function tests
        run: deno test supabase/functions

      # Los 15 errores que impedian activarlo estaban mal diagnosticados: no eran
      # ruido del generic `Database`, eran dos defectos de tipos reales. Ver el
      # commit que lo activo.
      - name: Type-check Edge Functions
        run: deno check supabase/functions

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # El smoke autenticado se provee su propia cuenta efimera con service_role
      # y la borra al terminar, asi que no depende de que exista una cuenta de
      # prueba concreta. Sin el secreto el bloque autenticado se salta y solo
      # corre el publico; con el, cero skips.
      #
      # Si los secretos VITE_* llegan vacios, el webServer de playwright.config
      # arranca la app con credenciales stub: sin ellas la app entra en modo
      # degradado (/auth/sign-in muestra "El acceso aun no esta disponible") y
      # el smoke publico probaria un shell que ningun visitante ve.
      - name: Run smoke suite
        run: npm run test:e2e:smoke
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          E2E_TARGET_ENV: development
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}

      # Recuperar contrasena es el unico flujo que usa quien ya no puede entrar:
      # si se rompe, la persona afectada no tiene como reportarlo desde dentro
      # del producto. Se provee su propia cuenta efimera y la borra, igual que el
      # smoke autenticado, asi que no deja rastro en el proyecto remoto.
      - name: Run password recovery suite
        run: npm run test:e2e:recovery
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          E2E_TARGET_ENV: development
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency audit policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install AZUL service dependencies
        run: npm ci
        working-directory: services/azul-payments

      # Politica en `scripts/audit-policy.ts`: high y critical rompen, con
      # excepciones documentadas y con fecha de vencimiento en
      # `audit-exceptions.json`.
      - name: Enforce dependency audit policy
        run: npm run audit:policy

  # D3 · Las Edge Functions dejan de salir desde una laptop.
  #
  # Hasta hoy se desplegaban a mano, lo que tiene dos consecuencias que no se ven
  # hasta que duelen: no queda registro de qué versión corre en el remoto, y el
  # despliegue **no pasa por `db push`**, así que una función desplegada y un
  # repositorio sin commitear se separan sin que nada avise.
  #
  # Se ejecuta en paralelo con el despliegue del frontend, no antes: acoplarlos
  # daría una garantía falsa de orden entre dos cosas que igual se publican por
  # separado. Un cambio que rompa el contrato entre frontend y función tiene que
  # ir en dos despliegues, primero la función.
  deploy-edge-functions:
    name: Deploy Edge Functions
    if: (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - verify
      - edge-functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cada rama contra su propio proyecto. Si `main` empujara las funciones al
    # proyecto de desarrollo, el cron de produccion dispararia contra las
    # funciones equivocadas —es exactamente el fallo que B4 documenta—.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      # Fallo ruidoso y con instrucciones: un despliegue de funciones que se
      # salta en silencio es como se llega a "creiamos que estaban desplegadas".
      # Los valores llegan por `env:` y no interpolados en el script: una
      # expresion `${{ }}` dentro de un `run` se sustituye como texto antes de
      # que bash lo lea, asi que su contenido puede convertirse en comandos.
      # Comprobar que **existen** no basta, y esa era la debilidad de este paso:
      # un secret o una var que el environment no define **no queda vacia**, la
      # hereda del repositorio. Como el repositorio tiene las de `db-drift.yml`
      # —que apuntan al proyecto de desarrollo—, olvidarse de declarar
      # `SUPABASE_PROJECT_REF` en el environment `production` no fallaba: pasaba
      # en verde y publicaba las funciones de produccion en la base de
      # desarrollo. Es el fallo B4 del checklist, y la herencia lo hacia
      # silencioso justo donde mas caro sale.
      #
      # Por eso se comprueba el **valor**, no solo la presencia. La lista de refs
      # que no son produccion se versiona aqui igual que en
      # `src/shared/config/required-env.ts` y `tests/e2e/support/target-guard.ts`:
      # cambiar una variable en el panel no puede bastar para cruzar entornos.
      - name: Comprobar configuracion del entorno
        env:
          APP_URL: ${{ vars.VITE_AUTH_SITE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ENTORNO: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: |
          refs_de_no_produccion=(jgmojkzthfogynqixkob) # development

          faltan=()
          [[ -n "${APP_URL:-}" ]] || faltan+=("var VITE_AUTH_SITE_URL para APP_URL")
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || faltan+=("secret SUPABASE_ACCESS_TOKEN")
          [[ -n "${SUPABASE_PROJECT_REF:-}" ]] || faltan+=("var SUPABASE_PROJECT_REF")

          if (( ${#faltan[@]} > 0 )); then
            echo "No se pueden desplegar las Edge Functions del entorno '$ENTORNO'." >&2
            printf '  · falta %s\n' "${faltan[@]}" >&2
            echo "Configuralos en Settings → Environments → ese entorno." >&2
            exit 1
          fi

          es_de_no_produccion=false
          for ref in "${refs_de_no_produccion[@]}"; do
            [[ "$SUPABASE_PROJECT_REF" == "$ref" ]] && es_de_no_produccion=true
          done

          if [[ "$ENTORNO" == "production" && "$es_de_no_produccion" == true ]]; then
            echo "SUPABASE_PROJECT_REF apunta a un proyecto que no es el de produccion." >&2
            echo "Desplegar aqui dejaria el cron de produccion disparando contra las" >&2
            echo "funciones de desarrollo. Declaralo en el environment 'production'." >&2
            exit 1
          fi

          if [[ "$ENTORNO" == "staging" && "$es_de_no_produccion" == false ]]; then
            echo "SUPABASE_PROJECT_REF no es un proyecto de no-produccion." >&2
            echo "Staging no debe publicar Edge Functions en la base de produccion." >&2
            exit 1
          fi

          origen_esperado='https://dev.asidominicana.do'
          [[ "$ENTORNO" == "production" ]] && origen_esperado='https://asidominicana.do'
          if [[ "$APP_URL" != "$origen_esperado" ]]; then
            echo "VITE_AUTH_SITE_URL no corresponde al entorno '$ENTORNO'." >&2
            echo "Esperado: $origen_esperado" >&2
            exit 1
          fi

          echo "Entorno '$ENTORNO' → proyecto $SUPABASE_PROJECT_REF."

      - name: Sincronizar origen de enlaces de correo
        env:
          APP_URL: ${{ vars.VITE_AUTH_SITE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase secrets set APP_URL="$APP_URL" --project-ref "$SUPABASE_PROJECT_REF"

      # `--use-api` empaqueta en el servidor. Sin la bandera, el CLI intenta
      # aplanar `node_modules` con Docker y termina en
      # `UnknownError: An error occurred in Effect.tryPromise` justo despues de
      # `Bundling Function`: sin codigo HTTP y sin pista de que fallo.
      #
      # Sin nombre de funcion despliega todas las de `supabase/functions`; los
      # directorios que empiezan por `_` (como `_shared`) no son funciones y el
      # CLI los ignora.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      # Deja en el log que quedo desplegado y con que fecha. Es el registro que
      # no existia cuando se desplegaba a mano.
      - name: Listar lo que quedo desplegado
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

  deploy-staging:
    name: Deploy staging to Hostinger
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - verify
      - azul-service
      - mutation-testing
      - edge-functions
      - e2e-smoke
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://dev.asidominicana.do
    env:
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_AUTH_SITE_URL: ${{ vars.VITE_AUTH_SITE_URL }}
      VITE_AZUL_PAYMENTS_URL: ${{ vars.VITE_AZUL_PAYMENTS_URL }}
      VITE_DEPLOY_ENV: ${{ vars.VITE_DEPLOY_ENV }}
      VITE_PRODUCTION_SITE_URL: ${{ vars.VITE_PRODUCTION_SITE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging artifact
        run: npm run build:staging

      - name: Preserve staging sourcemaps
        uses: actions/upload-artifact@v6
        with:
          name: staging-sourcemaps-${{ github.sha }}
          path: dist/assets/*.map
          if-no-files-found: error
          retention-days: 30

      - name: Prepare public artifact
        run: |
          find dist/assets -type f -name '*.map' -delete
          test -f dist/.htaccess
          test -f dist/index.html
          test -z "$(find dist -type f -name '*.map' -print -quit)"

      - name: Preserve deployable artifact
        uses: actions/upload-artifact@v6
        with:
          name: staging-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      # Publica primero los assets con hash, activa index.html y sw.js al final
      # mediante temporales, verifica por HTTPS y restaura los entrypoints si la
      # comprobacion posterior falla. Los bundles anteriores se conservan para
      # no romper las pestañas que estaban abiertas durante el despliegue.
      - name: Activate verified staging release
        run: scripts/deploy-hostinger-release.sh dist https://dev.asidominicana.do

  # D1 · El despliegue de produccion, espejo de `deploy-staging`.
  #
  # Existe porque hoy no habia ninguno, y su ausencia ya causo el incidente que
  # abre `docs/checklists/SALIDA_A_PRODUCCION.md`: `asidominicana.do` sirvio
  # durante tres dias un artefacto subido a mano cuyo bundle apuntaba al proyecto
  # Supabase de desarrollo. Sin un camino automatico, subir a mano es el unico
  # camino, y subir a mano es como se equivoca uno de base.
  #
  # Las diferencias con staging son tres y son todas deliberadas:
  #   · sale de `main`, no de `staging`;
  #   · el environment `production` puede exigir revision manual antes de correr,
  #     que es donde vive la ultima oportunidad de parar un despliegue;
  #   · construye en modo produccion (`npm run build`), y ese modo es el que
  #     activa `validateProductionEnv` con su negativa a publicar contra la base
  #     de desarrollo.
  deploy-production:
    name: Deploy production to Hostinger
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - verify
      - azul-service
      - mutation-testing
      - edge-functions
      - e2e-smoke
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://asidominicana.do
    env:
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_AUTH_SITE_URL: ${{ vars.VITE_AUTH_SITE_URL }}
      VITE_AZUL_PAYMENTS_URL: ${{ vars.VITE_AZUL_PAYMENTS_URL }}
      VITE_DEPLOY_ENV: ${{ vars.VITE_DEPLOY_ENV }}
      VITE_PRODUCTION_SITE_URL: ${{ vars.VITE_PRODUCTION_SITE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Modo produccion: `.env.production` fija `VITE_DEPLOY_ENV=production` y el
      # resto lo inyecta el environment. `validateProductionEnv` aborta aqui si
      # falta una variable critica o si el bundle apuntaria a una base que no es
      # la de produccion.
      - name: Build production artifact
        run: npm run build

      # Los sourcemaps se guardan y **no** se publican: con ellos, cambiar la
      # extension en la URL de un bundle basta para leerse el fuente entero.
      - name: Preserve production sourcemaps
        uses: actions/upload-artifact@v6
        with:
          name: production-sourcemaps-${{ github.sha }}
          path: dist/assets/*.map
          if-no-files-found: error
          retention-days: 90

      - name: Prepare public artifact
        run: |
          find dist/assets -type f -name '*.map' -delete
          test -f dist/.htaccess
          test -f dist/index.html
          test -z "$(find dist -type f -name '*.map' -print -quit)"

      # El artefacto exacto que se publico, por si hay que reponerlo sin
      # reconstruir: un rebuild meses despues no da el mismo bundle.
      - name: Preserve deployable artifact
        uses: actions/upload-artifact@v6
        with:
          name: production-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      # Mismo script que staging: publica primero los assets con hash, activa
      # index.html y sw.js al final mediante temporales, verifica por HTTPS y
      # restaura los entrypoints si la comprobacion falla.
      - name: Activate verified production release
        run: scripts/deploy-hostinger-release.sh dist https://asidominicana.do

      # Lectura pura contra el sitio ya publicado, sin service_role. Si el
      # despliegue quedo servible pero roto, esto lo dice antes que un usuario.
      # Va despues de publicar a proposito: comprueba lo que hay en el dominio,
      # no lo que se construyo.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke de produccion
        run: npm run test:e2e:production-smoke
